# Plume colors, rendered by a Noctalia template.
#
# Add to ~/.config/noctalia/config.toml:
#
#   [theme.templates.user.plume]
#   input_path  = "/usr/share/plume/templates/colors.toml"   # <prefix>/share/... for local builds
#   output_path = "$XDG_CONFIG_HOME/plume/colors.toml"
#
# Plume reloads the rendered file as soon as it is written.

[colors]
primary = "{{ colors.primary.default.hex }}"
on_primary = "{{ colors.on_primary.default.hex }}"
primary_container = "{{ colors.primary_container.default.hex }}"
on_primary_container = "{{ colors.on_primary_container.default.hex }}"
secondary = "{{ colors.secondary.default.hex }}"
on_secondary = "{{ colors.on_secondary.default.hex }}"
secondary_container = "{{ colors.secondary_container.default.hex }}"
on_secondary_container = "{{ colors.on_secondary_container.default.hex }}"
tertiary = "{{ colors.tertiary.default.hex }}"
on_tertiary = "{{ colors.on_tertiary.default.hex }}"
tertiary_container = "{{ colors.tertiary_container.default.hex }}"
on_tertiary_container = "{{ colors.on_tertiary_container.default.hex }}"
error = "{{ colors.error.default.hex }}"
on_error = "{{ colors.on_error.default.hex }}"
error_container = "{{ colors.error_container.default.hex }}"
on_error_container = "{{ colors.on_error_container.default.hex }}"
surface = "{{ colors.surface.default.hex }}"
on_surface = "{{ colors.on_surface.default.hex }}"
on_surface_variant = "{{ colors.on_surface_variant.default.hex }}"
surface_container_low = "{{ colors.surface_container_low.default.hex }}"
surface_container = "{{ colors.surface_container.default.hex }}"
surface_container_high = "{{ colors.surface_container_high.default.hex }}"
surface_container_highest = "{{ colors.surface_container_highest.default.hex }}"
outline_variant = "{{ colors.outline_variant.default.hex }}"
shadow = "{{ colors.shadow.default.hex }}"
scrim = "{{ colors.scrim.default.hex }}"
hover = "{{ colors.hover.default.hex }}"
on_hover = "{{ colors.on_hover.default.hex }}"

# Colors of syntax highlighting, from the terminal palette so code looks like it does in the
# terminal. Every key is optional; what is left out is mixed from the colors above.
[syntax]
comment = "{{ colors.terminal_bright_black.default.hex }}"
keyword = "{{ colors.terminal_normal_magenta.default.hex }}"
string = "{{ colors.terminal_normal_green.default.hex }}"
escape = "{{ colors.terminal_bright_cyan.default.hex }}"
number = "{{ colors.terminal_normal_yellow.default.hex }}"
constant = "{{ colors.terminal_normal_yellow.default.hex }}"
function = "{{ colors.terminal_normal_blue.default.hex }}"
type = "{{ colors.terminal_normal_cyan.default.hex }}"
property = "{{ colors.terminal_bright_blue.default.hex }}"
builtin = "{{ colors.terminal_normal_red.default.hex }}"
heading = "{{ colors.terminal_bright_magenta.default.hex }}"
link = "{{ colors.terminal_normal_cyan.default.hex }}"
emphasis = "{{ colors.terminal_bright_yellow.default.hex }}"
added = "{{ colors.terminal_normal_green.default.hex }}"
removed = "{{ colors.terminal_normal_red.default.hex }}"
changed = "{{ colors.terminal_normal_yellow.default.hex }}"
